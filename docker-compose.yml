services:
  mw4trackstats:
    build: .
    container_name: mw4trackstats
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3001
      - SERVE_CLIENT_DIST=true
      - TRUST_PROXY=true
      - DATABASE_PATH=/app/server/data/mw4trackstats.sqlite
      - IMAGES_DIR=/app/server/data/images
    volumes:
      - ./server/data:/app/server/data
